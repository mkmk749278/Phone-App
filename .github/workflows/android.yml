name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Also build a release APK/AAB"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Gradle is happier with an explicit, modest heap on a 2-core runner than with
  # whatever it would guess from the host.
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false
  JAVA_VERSION: "17"

jobs:
  # ---------------------------------------------------------------------------
  # Everything that must pass before anything else is worth doing.
  # ---------------------------------------------------------------------------
  verify:
    name: Test, lint and privacy gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android lint
        run: ./gradlew lintDebug --stacktrace

      # The app's central privacy claim is that it cannot reach the network. This
      # inspects the MERGED manifest, so a network permission pulled in by any
      # transitive dependency fails the build rather than shipping silently.
      - name: Offline privacy gate
        run: ./gradlew checkNoInternetPermission --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Installable builds for every branch and PR.
  #
  # The `preview` variant is the one testers should install. It is a full release
  # build — R8-shrunk, not debuggable, baseline profile installed — signed with the
  # debug key so it can go straight onto a phone without any secrets. A debug APK
  # is 12x larger and runs Compose in a debuggable process, which is not a fair
  # test of how the app actually performs.
  # ---------------------------------------------------------------------------
  test-builds:
    name: Preview and debug APKs
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble preview and debug
        run: ./gradlew assemblePreview assembleDebug --stacktrace

      - name: Report APK sizes
        run: |
          {
            echo "### Installable builds"
            echo
            echo "| Build | Size | Install this one? |"
            echo "|---|---|---|"
            for apk in app/build/outputs/apk/preview/*.apk; do
              size=$(du -h "$apk" | cut -f1)
              echo "| preview (optimised) | $size | **Yes** — this is what the app really performs like |"
            done
            for apk in app/build/outputs/apk/debug/*.apk; do
              size=$(du -h "$apk" | cut -f1)
              echo "| debug | $size | Only for attaching a debugger |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: DualShieldPhone-preview-INSTALL-THIS
          path: app/build/outputs/apk/preview/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DualShieldPhone-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Signed release build.
  #
  # Signing material comes from GitHub Actions secrets and is written to a file
  # under RUNNER_TEMP, never into the workspace, so it cannot be picked up by an
  # artifact upload. If the secrets are absent — a fork PR, or a repo that has not
  # been set up yet — the release is built unsigned instead of failing, and the
  # job says so in the summary.
  # ---------------------------------------------------------------------------
  release-artifacts:
    name: Release APK and AAB
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 45
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret is configured."
            echo "The release build will be produced UNSIGNED."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keystore_path="$RUNNER_TEMP/dualshield-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          if ! keytool -list -keystore "$keystore_path" \
                -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" > /dev/null 2>&1; then
            echo "::error::The decoded keystore could not be opened. Check ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi
          echo "keystore_path=$keystore_path" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Assemble release
        env:
          DSP_KEYSTORE_FILE: ${{ steps.keystore.outputs.keystore_path }}
          DSP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DSP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DSP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Remove keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/dualshield-release.jks"

      - name: Summarise
        run: |
          {
            echo "### Release build"
            echo
            if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
              echo "- Signed with the repository's release keystore."
            else
              echo "- **Unsigned.** Add the signing secrets to produce an installable release build."
            fi
            echo "- Offline privacy gate ran as part of \`assembleRelease\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: DualShieldPhone-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: DualShieldPhone-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 90

      - name: Attach artifacts to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
